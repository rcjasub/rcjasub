name: Update profile art

"on":
  # schedule:
  #   - cron: "17 6 * * *"   # ~06:17 UTC daily -- disabled: was auto-committing every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

# the contribution heatmap has its own workflow (update-contributions.yml)
jobs:
  info-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - run: python scripts/fetch_github_stats.py
      - run: python scripts/make_info_card.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/github_stats.json info-card.svg"
